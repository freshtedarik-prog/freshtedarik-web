name: Sayfaları üret

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "assets/**"
      - "admin.html"
  schedule:
    - cron: "15 3 * * *"   # her gece 06:15 (TR): panelde değişen ürünler statik sayfalara işlenir
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sayfaları üret
        run: python3 tools/build.py
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "Fresh Tedarik Bot"
          git config user.email "freshtedarik@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo "Değişiklik yok"; else git commit -m "Sayfalar otomatik güncellendi" && git push; fi
